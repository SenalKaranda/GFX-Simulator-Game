<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="GFX Simulator: the game for people who think games are for looking at. Gameplay not included." />
    <meta name="theme-color" content="#0a0c11" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>GFX Simulator</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <h1>GFX<span>SIMULATOR</span></h1>
          <p class="tagline">Gameplay sold separately. (It is not sold.)</p>
        </div>
        <div class="wallet">
          <div class="wallet-main"><span id="pixels">0</span> <small>px</small></div>
          <div class="wallet-sub"><span id="pps">0</span> px/s · <span id="click-value">1</span> per click</div>
        </div>
        <div class="topbar-actions">
          <div class="tf-chip" id="tf-chip" hidden><b id="tf">0</b> TF</div>
          <button class="icon-btn" id="btn-photo" title="Photo mode (P)" aria-label="Photo mode">◉</button>
          <button class="icon-btn" id="btn-mute" title="Mute everything (M)" aria-label="Mute">♪</button>
        </div>
      </header>

      <main class="layout">
        <section class="stage">
          <div class="viewport" id="viewport">
            <div class="hud hud-tl">
              <div class="fps" id="fps">60 FPS</div>
              <div class="res" id="res">64 × 36</div>
            </div>
            <div class="hud hud-tr">
              <div class="badge" id="rt-badge" hidden>RAYS: TRACED</div>
              <div class="badge badge-warn" id="challenge-badge" hidden></div>
            </div>
            <div class="hud hud-bottom">
              <div class="rank-row"><span id="rank">Potato</span><span id="fidelity">Fidelity 0</span></div>
              <div class="bar"><div class="bar-fill" id="fidelity-bar"></div></div>
            </div>
            <div class="hint" id="hint">Click the scene to render pixels</div>
            <button class="dead-pixel" id="dead-pixel" hidden aria-label="Dead pixel"></button>
            <div class="floaters" id="floaters"></div>
          </div>

          <div class="review" id="review"></div>
          <div class="feed" id="feed" aria-live="off"></div>
        </section>

        <aside class="panel">
          <nav class="tabs" id="tabs" role="tablist"></nav>
          <div class="tab-body" id="tab-body"></div>
        </aside>
      </main>
    </div>
    <div class="toasts" id="toasts"></div>
    <div class="modal-root" id="modal-root" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
